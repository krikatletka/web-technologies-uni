<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Профіль користувача</h2>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="profile-name">Ім'я</label>
                <input type="text" id="profile-name" name="profile-name" value="Kristina">
            </div>

            <div class="form-group">
                <label for="profile-email">Електронна пошта</label>
                <input type="email" id="profile-email" name="profile-email" value="example@email.com">
            </div>

            <div class="form-group">
                <label for="about">Про себе</label>
                <textarea id="about" name="about" rows="4">Коротка інформація про користувача...</textarea>
            </div>

            <button type="submit" class="submit-btn">Зберегти зміни</button>
        </form>
    </div>
</body>
</html>
